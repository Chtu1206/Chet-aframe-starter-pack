<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
     <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- <a-box position="-1 0.5 -5" rotation="0  0" color="#F3FC2F"></a-box> -->
      <a-sphere position="0 1 -5" radius="1.25" color="#"></a-sphere>
      <a-sphere position="0 2.4 -5" radius="1." color="#FFFFFF"></a-sphere>
      <a-sphere position="0 3.5 -5" radius="0.7" color="#FFFFFF"></a-sphere>
      <a-cone position="0 3.5 -4" rotation="90 0 0" radius-bottom="0.15" height="1" color="orange"></a-cone>
        <a-sphere position="-0.3 3.65 -4.4" radius="0.1" color="#000000"></a-sphere>
        <a-sphere position="0.3 3.65 -4.4" radius="0.1" color="#000000"></a-sphere>
        <a-sphere position="0 2.5 -4" radius="0.1" color="#000000"></a-sphere>
        <a-sphere position="0 2.1 -4.04" radius="0.1" color="#000000"></a-sphere>
        <a-sphere position="0 2.9 -4.14" radius="0.1" color="#000000"></a-sphere>
        
      <a-cylinder position="1.5 2.5 -5" rotation="0 0 100" radius="0.05" height="1" color="#654321"></a-cylinder>
      <a-cylinder position="2.06 2.7 -5" rotation="0 0 120" radius="0.04" height="0.5" color="#654321"></a-cylinder>
      <a-cylinder position="2.06 2.58 -5" rotation="0 0 100" radius="0.04" height="0.5" color="#654321"></a-cylinder>
      <a-cylinder position="2.06 2.53 -5" rotation="0 0 80" radius="0.04" height="0.5" color="#654321"></a-cylinder>

      <a-cylinder position="-1.5 2.5 -5" rotation="0 0 -100" radius="0.05" height="1" color="#654321"></a-cylinder>
      <a-cylinder position="-2.06 2.7 -5" rotation="0 0 -120" radius="0.04" height="0.5" color="#654321"></a-cylinder>
      <a-cylinder position="-2.06 2.58 -5" rotation="0 0 -100" radius="0.04" height="0.5" color="#654321"></a-cylinder>
      <a-cylinder position="-2.06 2.53 -5" rotation="0 0 -80" radius="0.04" height="0.5" color="#654321"></a-cylinder>


    
      <a-plane position="0 0.2 -4" rotation="-90 0 0" width="100" height="100" color="#FFFFFF"></a-plane>
      <!-- <a-sky color="#ECECEC"></a-sky> -->
      <!-- the enviroment entity includes a sky. Choose from the presets"none, default, contact, egypt, checkerboard, forest, goaland, yavapai, goldmine, threetowers, poison, arches, tron, japan, dream, volcano, starry, osiris, moon" -->
      <a-entity environment="preset: forest; dressingAmount: 100"></a-entity>

     
    </a-scene>
  </body>
</html>
